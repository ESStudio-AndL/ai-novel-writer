<style>
/* ============ 基础 ============ */
:root {
  --bg: #101119;
  --bg-soft: #15161f;
  --panel: #1a1c26;
  --panel-2: #222433;
  --line: #2c2f3d;
  --text: #e6e8f0;
  --muted: #8f96ac;
  --accent: #7c8cff;
  --accent-soft: rgba(124, 140, 255, .16);
  --ok: #4ec9a0;
  --warn: #e8b25e;
  --danger: #ef6a7a;
  --radius: 14px;
  --radius-sm: 10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overscroll-behavior-y: none;
}

/* ============ 主题（暗色 / 亮色 / 护眼纸） ============
 * 只覆盖变量，组件样式一律不动，避免主题切换时漏改某处硬编码颜色。
 */
body.theme-light {
  --bg: #f6f7fa;
  --bg-soft: #ffffff;
  --panel: #ffffff;
  --panel-2: #eef0f6;
  --line: #dfe3ec;
  --text: #1c1f2a;
  --muted: #6b7285;
  --accent: #5b6cf0;
  --accent-soft: rgba(91,108,240,.12);
  --ok: #1f9d76;
  --warn: #b8791c;
  --danger: #d2455c;
}
body.theme-light .appbar { background: rgba(246,247,250,.92); }
body.theme-light .tabbar { background: rgba(246,247,250,.96); }
body.theme-light .reader-bar { background: rgba(246,247,250,.94); }
body.theme-light .sheet-panel { background: var(--bg-soft); }
body.theme-light .toast { background: rgba(255,255,255,.98); }
body.theme-light .busy-box { box-shadow: 0 10px 30px rgba(20,25,50,.14); }
body.theme-light .btn.primary { color: #fff; }
body.theme-light .toast-action { color: #fff; }
body.theme-light .check-item.on .check-box::after { border-color: #fff; }
body.theme-light .book-cover { color: #fff; }

/* 护眼纸色：偏暖的米黄，长时间阅读更舒适 */
body.theme-sepia {
  --bg: #f4ecd8;
  --bg-soft: #fbf6e9;
  --panel: #fbf6e9;
  --panel-2: #ece3cd;
  --line: #ddd2b8;
  --text: #3b3226;
  --muted: #7d7361;
  --accent: #8a6d3b;
  --accent-soft: rgba(138,109,59,.14);
  --ok: #4e7d43;
  --warn: #a8701c;
  --danger: #a8453c;
}
body.theme-sepia .appbar { background: rgba(244,236,216,.94); }
body.theme-sepia .tabbar { background: rgba(244,236,216,.96); }
body.theme-sepia .reader-bar { background: rgba(244,236,216,.94); }
body.theme-sepia .sheet-panel { background: var(--bg-soft); }
body.theme-sepia .toast { background: rgba(251,246,233,.98); }
body.theme-sepia .book-cover { color: #fff; }
body.theme-sepia .check-item.on .check-box::after { border-color: #fff; }
body.theme-sepia .btn.primary { color: #fff; }
body.theme-sepia .toast-action { color: #fff; }

.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt4 { margin-top: 4px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 8px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.spacer { flex: 1; }

/* ============ 顶栏 ============ */
.appbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 6px;
  height: 52px; padding: 0 8px;
  background: rgba(16, 17, 25, .92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.appbar-title {
  font-size: 16.5px; font-weight: 600;
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.icon-btn {
  appearance: none; border: 0; background: transparent; color: var(--text);
  font-size: 22px; line-height: 1; width: 38px; height: 38px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.icon-btn:active { background: var(--panel-2); }
.icon-btn.primary-text { font-size: 14px; color: var(--accent); font-weight: 600; width: auto; padding: 0 8px; }
.icon-btn.small { font-size: 15px; width: 32px; height: 32px; }

/* ============ 底部主导航 ============ */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; align-items: stretch;
  padding-bottom: var(--safe-b);
  background: rgba(16, 17, 25, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tab-item {
  flex: 1; appearance: none; border: 0; background: transparent; color: var(--muted);
  font-family: inherit; font-size: 11.5px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 8px 0 7px;
}
.tab-item .tab-icon { font-size: 20px; line-height: 1; }
.tab-item .tab-label { letter-spacing: .5px; }
.tab-item:active { background: var(--panel-2); }
.tab-item.active { color: var(--accent); font-weight: 600; }

/* ============ 页面容器 ============ */
.page-root {
  padding: 12px 12px calc(28px + var(--safe-b));
  max-width: 820px; margin: 0 auto;
  animation: pageIn .18s ease;
}
body.has-tab .page-root { padding-bottom: calc(84px + var(--safe-b)); }
body.has-tab .toast-root { bottom: calc(84px + var(--safe-b)); }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.section-title {
  font-size: 13px; color: var(--muted); font-weight: 600;
  margin: 18px 4px 8px; letter-spacing: .4px;
}

/* ============ 卡片 / 列表 ============ */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.list { display: flex; flex-direction: column; gap: 10px; }

.book-card {
  display: flex; gap: 12px; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
}
.book-cover {
  width: 52px; flex: 0 0 52px; border-radius: 10px;
  background: linear-gradient(150deg, #3a3f6b, #6b4a7a);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.book-main { flex: 1; min-width: 0; }
.book-title { font-size: 16px; font-weight: 600; }
.book-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

/* ============ 按钮 ============ */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  border-radius: var(--radius-sm); padding: 9px 14px; font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { filter: brightness(1.2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0e1020; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(239,106,122,.4); background: transparent; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.xs { padding: 4px 8px; font-size: 12px; border-radius: 7px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }

/* ============ 表单 ============ */
.field { margin-bottom: 12px; }
.field > label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.input, .textarea, select.input {
  width: 100%; background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 15px; font-family: inherit; outline: none;
}
.input:focus, .textarea:focus { border-color: var(--accent); }
.textarea { min-height: 96px; resize: vertical; line-height: 1.65; }
.textarea.tall { min-height: 200px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ============ 开关 ============ */
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.switch input { display: none; }
.switch .track {
  width: 42px; height: 24px; border-radius: 999px; background: var(--panel-2);
  border: 1px solid var(--line); position: relative; transition: .18s; flex: 0 0 42px;
}
.switch .track::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--muted); transition: .18s;
}
.switch input:checked + .track { background: var(--accent-soft); border-color: var(--accent); }
.switch input:checked + .track::after { left: 20px; background: var(--accent); }

/* ============ Tabs ============ */
.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; font-size: 14px;
  background: var(--panel); border: 1px solid var(--line); color: var(--muted); cursor: pointer;
}
.tab.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px; font-size: 12.5px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
}
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

/* ============ 章节列表 ============ */
.chapter-item {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 11px 13px; display: flex; gap: 10px; align-items: flex-start;
}
.chapter-item .no {
  flex: 0 0 34px; height: 34px; border-radius: 9px; background: var(--panel-2);
  display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted);
}
.chapter-item.done .no { background: rgba(78,201,160,.14); color: var(--ok); }
.chapter-body { flex: 1; min-width: 0; }
.chapter-title { font-weight: 600; font-size: 15px; }
.chapter-outline {
  color: var(--muted); font-size: 13px; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.chapter-meta { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

/* ============ 分卷分组头 ============ */
.vol-head {
  margin: 16px 2px 8px; padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.vol-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.vol-head .btn { flex: 0 0 auto; }

/* ============ 阅读器 ============ */
.reader-viewport {
  position: fixed; inset: 52px 0 0 0; overflow: hidden; background: var(--bg);
  touch-action: pan-y;
}
.reader-page {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 14px 18px 96px; will-change: transform;
  transition: transform .26s cubic-bezier(.22,.61,.36,1);
}
.reader-page.dragging { transition: none; }
.reader-inner { max-width: 760px; margin: 0 auto; }
.reader-chapter-title { font-size: 19px; font-weight: 700; margin: 4px 0 2px; }
.reader-chapter-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
.reader-content { white-space: pre-wrap; word-break: break-word; letter-spacing: .2px; }
.reader-content p { margin: 0 0 1em; }
.reader-empty { color: var(--muted); text-align: center; padding: 40px 20px; }
/* 段间距由 --para-gap 控制（阅读设置里可调），
 * 正文用 \n\n 分段，这里把连续换行之间补出可调的间隔。
 */
.reader-body .reader-content { line-height: inherit; }
.reader-body { --para-gap: 1em; }
.cursor-blink::after {
  content: '▌'; color: var(--accent); animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* 阅读进度百分比（右下角常驻） */
.reader-prog-num {
  position: fixed; right: 10px; bottom: calc(56px + var(--safe-b)); z-index: 26;
  font-size: 11px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 8px;
  pointer-events: none; opacity: .85;
}

/* 流式写作时「暂停跟随」的恢复按钮：只在用户上翻看前文时出现。
 * 位置避开右下角悬浮球与进度百分比。 */
.reader-follow {
  position: fixed; right: 10px; bottom: calc(88px + var(--safe-b)); z-index: 27;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .22);
  animation: follow-in .18s ease-out;
}
@keyframes follow-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ============ 统计面板 ============ */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  gap: 8px; margin-bottom: 12px;
}
.stat-cell {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 8px; text-align: center;
}
.stat-cell b { display: block; font-size: 18px; color: var(--accent); }
.stat-cell span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.table-wrap { overflow-x: auto; }
.mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini-table th, .mini-table td {
  text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.mini-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.mini-table td:first-child { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }

.reader-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; align-items: center; gap: 8px; padding: 8px 10px calc(8px + var(--safe-b));
  background: rgba(16,17,25,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
}
.reader-bar .btn {
  flex: 1; padding: 8px 2px; font-size: 12.5px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.reader-progress {
  position: fixed; left: 0; bottom: 0; height: 2px; background: var(--accent); z-index: 26;
  transition: width .2s;
}

/* ============ AI 小编（对话页） ============ */
.chat-ctx { padding: 2px 0 8px; }
.chat-ctx-row { display: flex; align-items: center; gap: 8px; }
.chat-ctx-label { font-size: 12.5px; color: var(--muted); flex: 0 0 auto; }
.chat-ctx .btn { max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-ctx .hint { margin-top: 6px; }

.chat-txns {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  padding: 6px 10px; margin-bottom: 10px;
}
.chat-txn { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.chat-txn .tiny { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chat-list { display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; }
.chat-empty { color: var(--muted); font-size: 13px; line-height: 1.8; padding: 16px 4px; }
.chat-msg { display: flex; flex-direction: column; max-width: 92%; }
.chat-msg.me { align-self: flex-end; align-items: flex-end; }
.chat-msg.ai { align-self: flex-start; }
.chat-bubble {
  white-space: pre-wrap; word-break: break-word;
  padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.7;
  background: var(--panel); border: 1px solid var(--line);
}
.chat-msg.me .chat-bubble { background: var(--accent-soft); border-color: var(--accent); }

.chat-acts { margin-top: 8px; width: 100%; }
.chat-acts-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.chat-act {
  display: flex; flex-direction: column; gap: 7px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
  padding: 9px 10px; margin-bottom: 6px;
}
.chat-act.bad { opacity: .72; border-style: dashed; }
.chat-act-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.chat-act-head { font-size: 13px; font-weight: 500; }
.chat-act-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.chat-act-diff { font-size: 12.5px; color: var(--muted); line-height: 1.65; word-break: break-word; }
.chat-act-diff.one-line { display: block; max-height: 3.3em; overflow: hidden; }
.chat-act-diff s { opacity: .55; }
.chat-act-diff b { color: var(--text); font-weight: 500; }
.chat-act-diff .chat-act-tag {
  display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); margin-right: 4px;
}
.chat-act-why { font-size: 12.5px; color: var(--danger); line-height: 1.6; }

.chat-input {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; gap: 8px; align-items: flex-end;
  padding: 8px 0 calc(8px + var(--safe-b));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
.chat-input .textarea { flex: 1; min-height: 44px; max-height: 33vh; }
.chat-input .btn { flex: 0 0 auto; }

/* ---- 划线改稿 ---- */
/* 标记高亮：序号必须用 ::after 画，写成真文本节点会让阅读器算正文偏移时整体错位 */
.reader-content mark.mk {
  background: var(--accent-soft);
  border-bottom: 2px solid var(--accent);
  border-radius: 3px; padding: 0 1px; color: inherit; cursor: pointer;
}
.reader-content mark.mk[data-n]::after {
  content: attr(data-n);
  font-size: .62em; vertical-align: super; line-height: 0;
  color: var(--accent); margin-left: 1px; font-weight: 700;
}
/* 从面板「定位」跳回正文时，闪一下让眼睛找得到 */
.reader-content mark.mk.mk-flash {
  background: var(--accent); color: var(--bg);
  transition: background .2s, color .2s;
}
/* 意见框失焦即存，给个轻微的正反馈 */
#sheetBody .input.saved { border-color: var(--accent); }
.entry.sug .chip.warn { color: var(--danger, #e5534b); border-color: currentColor; }

/* ============ 弹出面板 ============ */
.sheet-root { position: fixed; inset: 0; z-index: 60; }
.sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh;
  display: flex; flex-direction: column;
  background: var(--bg-soft); border-top: 1px solid var(--line);
  border-radius: 18px 18px 0 0;
  animation: sheetUp .24s cubic-bezier(.22,.61,.36,1);
  padding-bottom: var(--safe-b);
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head {
  display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px;
  border-bottom: 1px solid var(--line);
}
.sheet-title { flex: 1; font-size: 16px; font-weight: 600; }
.sheet-body { overflow-y: auto; padding: 12px 14px; flex: 1; }
.sheet-foot { padding: 10px 14px 14px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1; }

/* ============ 全屏编辑器 ============ */
.fullscreen-editor {
  position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column;
}
.fe-textarea {
  flex: 1; width: 100%; background: var(--bg); color: var(--text); border: 0; outline: none;
  padding: 14px 16px; font-size: 16px; line-height: 1.75; resize: none; font-family: inherit;
}
.fe-status { padding: 6px 16px calc(10px + var(--safe-b)); color: var(--muted); font-size: 12px; text-align: right; }

/* ============ Toast ============ */
.toast-root {
  position: fixed; left: 0; right: 0; bottom: calc(78px + var(--safe-b)); z-index: 90;
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.toast {
  background: rgba(34,36,51,.96); border: 1px solid var(--line); color: var(--text);
  padding: 9px 16px; border-radius: 999px; font-size: 13.5px; max-width: 86vw;
  animation: toastIn .2s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* 带一个轻动作的 toast（如「AI 推荐了 N 条新设定 / 去看看」），不弹面板 */
.toast-action {
  margin-left: 10px; padding: 3px 10px; border-radius: 999px;
  background: var(--accent); color: #0e1020; border: none;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.toast-action:active { opacity: .8; }

/* ============ Busy ============ */
.busy {
  position: fixed; inset: 0; z-index: 80; background: rgba(8,9,14,.6);
  display: flex; align-items: center; justify-content: center;
}
.busy-box {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 180px;
}
/* 写作时的轻量模式：顶部浮条，不挡正文、可继续滚动 */
.busy.bar { background: transparent; align-items: flex-start; pointer-events: none; }
.busy.bar .busy-box {
  margin-top: 60px; width: min(560px, calc(100% - 24px));
  flex-direction: row; justify-content: space-between; align-items: center;
  padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); pointer-events: auto;
}
.busy.bar .spinner { width: 18px; height: 18px; border-width: 2px; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 多选列表（记忆重建选章节等） ============ */
.check-list { display: flex; flex-direction: column; gap: 6px; max-height: 52vh; overflow-y: auto; }
.check-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 11px; border-radius: var(--radius-sm);
  background: var(--panel); border: 1px solid var(--line); cursor: pointer;
}
.check-item.on { border-color: var(--accent); background: var(--accent-soft); }
.check-box {
  flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--bg-soft); position: relative;
}
.check-item.on .check-box { background: var(--accent); border-color: var(--accent); }
.check-item.on .check-box::after {
  content: ''; position: absolute; left: 5px; top: 1px; width: 6px; height: 11px;
  border: solid #0e1020; border-width: 0 2px 2px 0; transform: rotate(42deg);
}
.check-main { flex: 1; min-width: 0; }
.check-name { font-size: 14px; }

/* ============ 最近浏览（每本书的进度） ============ */
.recent-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 13px; margin-bottom: 10px;
}
.recent-card:active { background: var(--panel-2); }
.recent-book {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--muted);
}
.recent-chapter { font-size: 16px; font-weight: 600; margin-top: 4px; }
.recent-preview {
  color: var(--muted); font-size: 13px; margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.recent-meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }

/* ============ 条目卡（世界书 / 提示词 / 记忆） ============ */
.entry {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 8px;
}
.entry-head { display: flex; align-items: center; gap: 8px; }
.entry-name { font-weight: 600; flex: 1; min-width: 0; }
.entry-body {
  color: var(--muted); font-size: 13px; margin-top: 5px; white-space: pre-wrap;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.empty-tip { color: var(--muted); text-align: center; padding: 26px 12px; font-size: 13.5px; }

/* ============ 全文搜索 ============ */
.search-box {
  position: relative; display: flex; align-items: center; gap: 6px;
  margin: 2px 0 12px;
}
.search-box .search-ico {
  position: absolute; left: 11px; font-size: 14px; opacity: .6; pointer-events: none;
}
.search-box .input { padding-left: 34px; padding-right: 40px; }
.search-box .icon-btn { position: absolute; right: 2px; }
.search-stat {
  font-size: 12.5px; color: var(--muted); margin: 0 2px 10px;
}
.search-stat b { color: var(--text); }
.search-hit {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; cursor: pointer;
}
.search-hit:active { background: var(--panel-2); }
.search-hit-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.search-hit-body {
  font-size: 13px; color: var(--text); line-height: 1.65;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.search-hit-body mark {
  background: rgba(232,178,94,.28); color: var(--warn);
  border-radius: 3px; padding: 0 2px;
}

/* 书架卡片上的细进度条：已写章节 / 总章节 */
.progress-thin {
  height: 3px; border-radius: 999px; background: var(--panel-2);
  margin: 7px 0 4px; overflow: hidden;
}
.progress-thin i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* AI 推荐的设定（待转正） */
.entry.sug { border-color: var(--accent); background: var(--accent-soft); }
.entry.sug .entry-body { color: var(--text); }

/* ============ 标签页：固定展示，不横向滚动、不自动回正 ============ */
.tabs-fixed {
  flex-wrap: wrap; overflow: visible;
  column-gap: 6px; row-gap: 6px;
}
.tabs-fixed .tab { flex: 1 1 30%; text-align: center; padding: 7px 6px; }

/* ============ 章节目录：分卷节 ============ */
.vol-section { margin-bottom: 4px; }
.vol-title-row {
  display: flex; align-items: baseline; gap: 6px; cursor: pointer;
  padding: 4px 2px; border-radius: 8px; user-select: none;
}
.vol-title-row:active { background: var(--panel-2); }
.vol-caret { flex: 0 0 auto; width: 16px; color: var(--muted); font-size: 12px; }
.vol-title { font-size: 15px; font-weight: 700; }
.vol-section.collapsed .vol-chapters { display: none; }

/* 章节行整行可点（行内按钮仍各自触发） */
.chapter-item.clickable { cursor: pointer; }
.chapter-item.clickable:active { border-color: var(--accent); }

/* ============ 世界设定作用域切换 ============ */
.scope-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }

/* ============ 可拖动悬浮球 ============ */
.fab {
  position: fixed; right: 14px; bottom: calc(86px + var(--safe-b)); z-index: 45;
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--accent); font-size: 19px; line-height: 1;
  box-shadow: 0 4px 14px rgba(0,0,0,.35); cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none;
}
.fab:active { filter: brightness(1.15); }
.fab-panel {
  position: fixed; z-index: 46; width: 186px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 8px 26px rgba(0,0,0,.4); padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.fab-panel .fab-title { font-size: 12px; color: var(--muted); padding: 0 2px; }

</style>
</head>
<body>

<div id="app">
  <header class="appbar" id="appbar"></header>
  <main class="page-root" id="page"></main>
</div>

<!-- 底部主导航 -->
<nav class="tabbar hidden" id="tabbar">
  <button class="tab-item" data-tab="books" data-act="nav" data-to="#/books">
    <span class="tab-icon">📚</span><span class="tab-label">书架</span>
  </button>
  <button class="tab-item" data-tab="recent" data-act="nav" data-to="#/recent">

  </button>
  <button class="tab-item" data-tab="settings" data-act="nav" data-to="#/settings">
    <span class="tab-icon">⚙</span><span class="tab-label">设置</span>
  </button>
</nav>

<!-- 底部弹出面板 -->
<div class="sheet-root hidden" id="sheetRoot">
  <div class="sheet-mask" data-sheet-close></div>
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle"></div>
      <button class="icon-btn" data-sheet-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<!-- 全屏编辑器（大文本） -->
<div class="fullscreen-editor hidden" id="fullEditor">
  <div class="appbar">
    <button class="icon-btn" id="feBack">‹</button>
    <div class="appbar-title" id="feTitle">编辑</div>
    <button class="icon-btn primary-text" id="feSave">保存</button>
  </div>
  <textarea class="fe-textarea" id="feText" spellcheck="false"></textarea>
  <div class="fe-status" id="feStatus"></div>
</div>

<div class="toast-root" id="toastRoot"></div>

<!-- 可拖动悬浮球：撤销上次改动 / 查看上次 AI 上下文 / 切换模型预设 -->
<div id="fab" class="fab" title="撤销 / AI 上下文 / 模型预设">◆</div>
<div id="fabPanel" class="fab-panel hidden">
  <div class="fab-title">快捷工具</div>
  <button class="btn block" data-act="fab.undo">↩ 撤销上次生成</button>
  <button class="btn block" data-act="fab.ctx">📋 查看上次 AI 上下文</button>
  <button class="btn block" data-act="fab.presets">🔀 切换模型预设</button>
</div>

<div class="busy hidden" id="busy">
  <div class="busy-box">
    <div class="spinner"></div>
    <div class="busy-text" id="busyText">处理中…</div>
    <button class="btn ghost sm" id="busyCancel">中止</button>
  </div>
</div>

<script>
/* =========================================================
 * Util —— 跨模块共用的纯函数
 * 原来 esc / fmtTime / wordCount / parseJsonMaybe 散落在
 * ui.js、ai.js、app.js 三处，或定义在错误的层里（比如 UI 需要
 * copyText 但它在 app.js），这里集中一份并保证行为一致。
 * ========================================================= */
(function (global) {
  'use strict';

  /* 【【…】】的匹配源。每次调用都新建一个 RegExp —— 带 g 的正则对象
   * 自己带着 lastIndex 状态，复用同一个会在连续调用之间互相干扰。 */
  var BRACKET_SRC = '【【([\\s\\S]*?)】】';

  var Util = {
    /* HTML 转义。
     * 除了常规五字符，这里额外处理反引号：属性值虽然用双引号包裹，
     * 但一旦将来有人把插值写进模板字符串或未加引号的属性里，反引号会成为逃逸口。
     */
    esc: function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');
    },

    /* 时间：今天显示「今天 HH:mm」，否则「M/D HH:mm」 */
    fmtTime: function (ts) {
      if (!ts) return '';
      var d = new Date(ts), n = new Date();
      var p = function (x) { return x < 10 ? '0' + x : '' + x; };
      if (d.toDateString() === n.toDateString()) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },

    /* 数字：过万折算成「N.N万」 */
    fmtNum: function (n) {
      n = n || 0;
      return n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
    },

    /* 中文字数：按非空白字符计。
     * 注意这是「字数」而非 token 数，对中文写作的直觉更准。
     */
    wordCount: function (t) {
      return String(t == null ? '' : t).replace(/\s/g, '').length;
    },

    /* token 粗估（不看 API 返回值时用）。
     * 混合中英文时 1 个中文字约 0.6 token、1 个英文词约 1.3 token；
     * 这里统一按「1 字符 ≈ 0.65 token」折算，用途是生成前让用户知道量级，
     * 精确数字以接口返回的 usage 为准。
     */
    estimateTokens: function (t) {
      var s = String(t == null ? '' : t);
      if (!s) return 0;
      var cjk = (s.match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3000-\u303f\uff00-\uffef]/g) || []).length;
      var rest = s.length - cjk;
      return Math.ceil(cjk * 0.6 + rest * 0.3);
    },

    /* 本地文风扫描：找出正文里命中禁词的片段（纯前端，零 API 成本）。
     * banned 支持换行 / 逗号 / 分号分隔。返回 [{ word, count, hits:[{at, excerpt}] }]
     */
    scanBanned: function (text, banned) {
      var s = String(text == null ? '' : text);
      var words = String(banned == null ? '' : banned)
        .split(/[\n,，、;；]+/).map(function (x) { return x.trim(); })
        .filter(function (x) { return x && x.length <= 40; });
      var out = [];
      words.forEach(function (w) {
        var hits = [], at = 0, guard = 0;
        while ((at = s.indexOf(w, at)) >= 0 && guard++ < 200) {
          hits.push({ at: at, excerpt: Util.safeSliceEnd(s.slice(Math.max(0, at - 18), at + w.length + 18), 60) });
          at += w.length;
        }
        if (hits.length) out.push({ word: w, count: hits.length, hits: hits.slice(0, 20) });
      });
      return out;
    },

    /* 按「字符」安全截断尾部：避免把 emoji 的代理对劈成半个 */
    safeSliceEnd: function (s, n) {
      s = String(s || '');
      if (s.length <= n) return s;
      var start = s.length - n;
      var c = s.charCodeAt(start);
      if (c >= 0xDC00 && c <= 0xDFFF) start += 1;
      return s.slice(start);
    },

    /* 按「字符」安全截断头部 */
    safeSliceStart: function (s, n) {
      s = String(s || '');
      if (s.length <= n) return s;
      var end = n;
      var c = s.charCodeAt(end - 1);
      if (c >= 0xD800 && c <= 0xDBFF) end -= 1;
      return s.slice(0, end);
    },

    /* 从 AI 回复里尽力抠出 JSON。
     * 依次尝试：整体 → 代码块内 → 第一个 {..} → 第一个 [..]
     */
    parseJsonMaybe: function (text) {
      var s = String(text || '').trim();
      s = s.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
      var tries = [];
      try { tries.push(JSON.parse(s)); } catch (e) { }
      var a = s.indexOf('{'), b = s.lastIndexOf('}');
      if (a >= 0 && b > a) { try { tries.push(JSON.parse(s.slice(a, b + 1))); } catch (e) { } }
      var c = s.indexOf('['), d = s.lastIndexOf(']');
      if (c >= 0 && d > c) { try { tries.push(JSON.parse(s.slice(c, d + 1))); } catch (e) { } }
      for (var i = 0; i < tries.length; i++) {
        if (tries[i] && typeof tries[i] === 'object') return tries[i];
      }
      throw new Error('AI 返回内容无法解析为 JSON，请重试或调低温度。\n\n原始返回前 200 字：\n' + Util.safeSliceStart(text, 200));
    },

    /* 清理正文：去掉包装用的 markdown 围栏和开头的标题行 */
    cleanText: function (t) {
      var s = String(t || '');
      s = s.replace(/\r\n/g, '\n');
      s = s.replace(/^\s*```[a-zA-Z]*\s*\n?/, '').replace(/\n?```\s*$/, '');
      s = s.replace(/^\s*#{1,6}\s*.*\n+/, '');
      s = s.replace(/^\s*\n+/, '');
      return s.trim();
    },

    /* 把数值钳制在 [min, max]，非数字时返回 fallback */
    clampInt: function (v, min, max, fallback) {
      var n = parseInt(v, 10);
      if (isNaN(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    },

    clampFloat: function (v, min, max, fallback) {
      var n = parseFloat(v);
      if (isNaN(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    },

    /* 复制到剪贴板：优先用 async API，失败回落到 execCommand（老 WebView / file:// 场景） */
    copyText: function (t) {
      t = String(t == null ? '' : t);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).catch(function () { Util._legacyCopy(t); });
          return true;
        }
      } catch (e) { }
      return Util._legacyCopy(t);
    },
    _legacyCopy: function (t) {
      try {
        var ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch (e) { return false; }
    },

    /* 触发浏览器下载 */
    download: function (text, filename, mime) {
      var blob = new Blob([text], { type: (mime || 'application/json') + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    },

    /* 文件名净化：去掉路径分隔符与非法字符，防止下载名异常 */
    safeFilename: function (name, fallback) {
      var s = String(name || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim();
      s = s.replace(/^\.+/, '');
      if (!s) s = fallback || 'untitled';
      return s.slice(0, 80);
    },

    /* =========================================================
     * 正文标记（【【】】框选改稿）
     *
     * 做法：作者直接在正文里用【【】】把要改的地方框起来，系统解析成条目。
     * 不用浏览器的选区 —— 选区的 DOM Range 与原文偏移的换算在移动端
     * （换行、软键盘、手势翻页叠加时）太不可靠，框选是纯文本层面的，所见即所得。
     * ========================================================= */

    /* 解析正文里所有的【【…】】。
     * start/end 覆盖**含方括号的整体**（替换时连框一起换掉，成稿里不会留下方括号）；
     * innerStart/innerEnd 是框内的正文范围。 */
    parseBracketMarks: function (content) {
      var s = String(content == null ? '' : content);
      var re = new RegExp(BRACKET_SRC, 'g');
      var out = [], m;
      while ((m = re.exec(s))) {
        var inner = m[1];
        if (!inner.trim()) continue;          // 空的【【】】不当标记
        var innerStart = m.index + 2;
        out.push({
          id: 'bk' + out.length,
          idx: out.length,
          start: m.index, end: m.index + m[0].length,
          innerStart: innerStart, innerEnd: innerStart + inner.length,
          anchor: inner,
          raw: m[0]
        });
      }
      return out;
    },

    /* 去掉正文里所有【【】】（保留框里的文字）：取消标记时用 */
    stripBrackets: function (content) {
      var s = String(content == null ? '' : content);
      return s.replace(new RegExp(BRACKET_SRC, 'g'), '$1');
    },

    /* 给渲染用：把正文切成「普通段 / 高亮段」。
     * 高亮段只显示框里的文字，方括号本身不出现。 */
    bracketSegments: function (content) {
      var s = String(content == null ? '' : content);
      var items = Util.parseBracketMarks(s);
      var out = [], at = 0;
      items.forEach(function (it) {
        if (it.start > at) out.push({ text: s.slice(at, it.start), mark: null });
        out.push({ text: it.anchor, mark: it });
        at = it.end;
      });
      if (at < s.length) out.push({ text: s.slice(at), mark: null });
      return out;
    },

    /* 把 AI 给的新文本放回正文：连【【】】一起换成新文本。
     * patches: [{ id, text }]（id 是 'bk0' 这种按出现顺序的编号）。
     * 倒序替换 → 前面片段变长不影响后面片段的位置。 */
    applyBracketPatches: function (content, items, patches) {
      var s = String(content == null ? '' : content);
      var byId = {};
      (patches || []).forEach(function (p) { if (p && p.id) byId[p.id] = String(p.text == null ? '' : p.text); });
      var jobs = [], applied = [], skipped = [];
      (items || []).forEach(function (it) {
        var nt = byId[it.id];
        if (nt == null || !String(nt).trim()) { skipped.push(it.id); return; }
        jobs.push({ start: it.start, end: it.end, text: nt, id: it.id });
      });
      jobs.sort(function (a, b) { return b.start - a.start; });
      var out = s;
      jobs.forEach(function (j) {
        out = out.slice(0, j.start) + j.text + out.slice(j.end);
        applied.push(j.id);
      });
      return { text: out, applied: applied, skipped: skipped };
    },

    /* =========================================================
     * 旧的选区标记（仍保留：给「按偏移/原文定位」这类通用需求用）
     * ========================================================= */

    /* 在正文里定位一条标记，返回 {start, end} 或 null（定位不到）。
     * 优先用记录下来的偏移（正文没变过时最准）；偏移处的文字对不上（正文被重新
     * 生成 / 手动编辑过）就退回按原文查找——**只在全文中唯一出现时才认**，
     * 否则同一句出现多次会静默改错地方。 */
    locateMark: function (content, mark) {
      var s = String(content == null ? '' : content);
      var anchor = mark && mark.anchor != null ? String(mark.anchor) : '';
      if (!anchor) return null;
      var st = typeof mark.start === 'number' ? mark.start : -1;
      if (st >= 0 && s.slice(st, st + anchor.length) === anchor) {
        return { start: st, end: st + anchor.length };
      }
      var at = s.indexOf(anchor);
      if (at < 0) return null;
      if (s.indexOf(anchor, at + 1) >= 0) return null;   // 多处出现，不敢猜
      return { start: at, end: at + anchor.length };
    },

    /* 把正文按标记切成带高亮的片段（供阅读器渲染）。
     * 返回 [{ start, end, text, mark }]，相邻两段之间的 text 是未标记的普通文本。
     * 重叠的标记只保留靠前那条（后标记的 start 落在前一条里就跳过）。 */
    splitByMarks: function (content, marks) {
      var s = String(content == null ? '' : content);
      var list = [];
      (marks || []).forEach(function (m) {
        var pos = Util.locateMark(s, m);
        if (pos) list.push({ start: pos.start, end: pos.end, mark: m });
      });
      list.sort(function (a, b) { return a.start - b.start || b.end - a.end; });
      var out = [], at = 0;
      list.forEach(function (x) {
        if (x.start < at) return;                    // 与前一条重叠，丢弃
        if (x.start > at) out.push({ start: at, end: x.start, text: s.slice(at, x.start), mark: null });
        out.push({ start: x.start, end: x.end, text: s.slice(x.start, x.end), mark: x.mark });
        at = x.end;
      });
      if (at < s.length) out.push({ start: at, end: s.length, text: s.slice(at), mark: null });
      return out;
    },

    /* 只把标记处替换成 AI 给的新文本，其余一字不动。
     * patches: [{ id, text }]。倒序替换 → 前面的偏移不被后面的长度变化影响。
     * 返回 { text, applied: [id], skipped: [id] }。 */
    applyPatches: function (content, marks, patches) {
      var s = String(content == null ? '' : content);
      var byId = {};
      (patches || []).forEach(function (p) { if (p && p.id) byId[p.id] = String(p.text == null ? '' : p.text); });
      var jobs = [], applied = [], skipped = [];
      (marks || []).forEach(function (m) {
        var pos = Util.locateMark(s, m);
        var nt = byId[m.id];
        /* 空白（含只有空格 / 换行）一律当「没给」：直接写回去等于把原文删了 */
        if (!pos || nt == null || !String(nt).trim()) { skipped.push(m.id); return; }
        jobs.push({ start: pos.start, end: pos.end, text: nt, id: m.id });
      });
      jobs.sort(function (a, b) { return b.start - a.start; });
      var out = s;
      jobs.forEach(function (j) {
        out = out.slice(0, j.start) + j.text + out.slice(j.end);
        applied.push(j.id);
      });
      return { text: out, applied: applied, skipped: skipped };
    }
  };

  global.Util = Util;
})(window);

    },
    removeGlobalPrompt: function (id) {
      this.state.globalPrompts = this.state.globalPrompts.filter(function (p) { return p.id !== id; });
      this.state.books.forEach(function (b) {
        b.globalPromptIds = b.globalPromptIds.filter(function (x) { return x !== id; });
      });
      this.save();
    },
    moveGlobalPrompt: function (id, dir) {
      var arr = this.state.globalPrompts;
      var i = arr.findIndex(function (p) { return p.id === id; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= arr.length) return;
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      this.save();
    },

    /* ---------- 书本 ---------- */
    getBook: function (id) {
      return this.state.books.filter(function (b) { return b.id === id; })[0] || null;
    },
    createBook: function (title) {
      var b = newBook(title);
      // 默认挂载全部已启用的全局提示词
      b.globalPromptIds = this.state.globalPrompts.filter(function (p) { return p.enabled; }).map(function (p) { return p.id; });
      this.state.books.unshift(b);
      this.save();
      return b;
    },
    deleteBook: function (id) {
      this.state.books = this.state.books.filter(function (b) { return b.id !== id; });
      this.save();
    },
    touchBook: function (book) { book.updatedAt = now(); },

    /* ---------- 世界书条目 ----------
     * scope：'' / 不传 = 全局设定；传入分卷 id = 只对该分卷的章节生效
     * extra（可选）：{ keywords, pin, state, location, goal, knows, relations }
     *   keywords：别名 / 触发词（逗号或换行分隔）。**填了**才按命中注入（省 token）；
     *     不填 = 始终注入（老行为，兼容旧数据）。pin = 常驻（即使有关键词也始终注入）。
     *   state/location/goal/knows/relations：角色卡结构化字段（人物栏专用，注入时附加在内容后）。
     */
    addWorldEntry: function (book, cat, name, content, scope, extra) {
      extra = extra || {};
      var e = { id: uid(), name: name || '', content: content || '', enabled: true, updatedAt: now() };
      if (scope) e.scope = scope;
      if (extra.keywords) e.keywords = String(extra.keywords);
      if (extra.pin) e.pin = true;
      if (cat === 'characters') {
        ['state', 'location', 'goal', 'knows', 'relations'].forEach(function (k) {
          if (extra[k]) e[k] = String(extra[k]);
        });
      }
      book.world[cat].push(e);
      this.touchBook(book); this.save();
      return e;
    },
    getWorldEntry: function (book, cat, id) {
      return (book.world[cat] || []).filter(function (e) { return e.id === id; })[0] || null;
    },
    removeWorldEntry: function (book, cat, id) {
      book.world[cat] = book.world[cat].filter(function (e) { return e.id !== id; });
      this.touchBook(book); this.save();
    },
    /* 生成某卷章节时实际注入的设定池：全局条目 + 该分卷专属条目。
     * volumeId 为空（如记忆预览）时只取全局。 */
    worldForChapter: function (book, volumeId) {
      var out = {};
      WORLD_CATS.forEach(function (cat) {
        out[cat] = (book.world[cat] || []).filter(function (e) {
          return !e.scope || e.scope === volumeId;
        });
      });
      return out;
    },
    /* 全部条目（含各分卷专属），供浏览 / 搜索使用 */
    allWorldEntries: function (book) {
      var out = {};
      WORLD_CATS.forEach(function (cat) { out[cat] = (book.world[cat] || []).slice(); });
      return out;
    },
    /* 条目所属范围的中文描述（界面标签用） */
    worldScopeLabel: function (book, scope) {
      if (!scope) return '全局';
      var v = this.getVolume(book, scope);
      if (!v) return '全局';
      var i = this.volumeIndex(book, scope);
      return '第' + (i >= 0 ? i + 1 : '?') + '卷';
    },

    /* ---------- AI 推荐设定（待转正） ----------
     * 生成记忆时 AI 顺手给出的新设定，不直接写入世界书：
     * 先存进 book.worldSug，由用户在「世界设定」页挑选转正或忽略。
     */
    addWorldSuggestions: function (book, items, chapter) {
      var self = this;
      if (!Array.isArray(book.worldSug)) book.worldSug = [];
      var ids = [];
      (items || []).forEach(function (it) {
        if (!it) return;
        var cat = WORLD_CATS.indexOf(it.cat) >= 0 ? it.cat : 'concepts';
        var name = String(it.name || '').trim();
        var content = String(it.content || '').trim();
        var kind = String(it.kind || 'add');
        var targetId = String(it.targetId || '');
        if (kind === 'update') {
          /* 修改型：必须指向一条仍然存在的设定，否则无从落地 */
          if (!self.findWorldEntry(book, targetId)) return;
          // 同一条设定只留一条待办，后来的覆盖先前的
          book.worldSug = book.worldSug.filter(function (s) { return s.targetId !== targetId; });
          var idx2 = chapter ? self.chapterIndex(book, chapter.id) : -1;
          var u = {
            id: uid(),
            kind: 'update', cat: cat, name: name,
            content: content,
            targetId: targetId,
            prevContent: String(it.prevContent || ''),
            reason: String(it.reason || '').trim(),
            keywords: String(it.keywords || '').trim(),
            chapterId: chapter ? chapter.id : '',
            chapterIndex: idx2,
            chapterTitle: chapter ? (chapter.title || '') : '',
            createdAt: now()
          };
          book.worldSug.push(u);
          ids.push(u.id);
          return;
        }
        if (!name && !content) return;
        // 已有同名条目 / 已在待转正列表里 → 跳过
        var has = (book.world[cat] || []).some(function (e) {
          return name && e.name && e.name.trim() === name;
        });
        if (has) return;
        var dup = book.worldSug.some(function (s) {
          return s.cat === cat && name && s.name && s.name.trim() === name;
        });
        if (dup) return;
        var idx = chapter ? self.chapterIndex(book, chapter.id) : -1;
        var s = {
          id: uid(),
          kind: 'add',
          cat: cat, name: name, content: content,
          keywords: String(it.keywords || '').trim(),
          reason: String(it.reason || '').trim(),
          chapterId: chapter ? chapter.id : '',
          // 章节已被删除时 chapterIndex 为 -1，界面会显示「来自第0章」，这里归一化为 -1 并让界面自己处理
          chapterIndex: idx,
          chapterTitle: chapter ? (chapter.title || '') : '',
          createdAt: now()
        };
        book.worldSug.push(s);
        ids.push(s.id);
      });
      if (ids.length) { this.touchBook(book); this.save(); }
      return ids;
    },
    /* 按 id 找一条已有设定（跨全部分栏与作用域） */
    findWorldEntry: function (book, id) {
      if (!id || !book || !book.world) return null;
      var found = null;
      WORLD_CATS.forEach(function (cat) {
        if (found) return;
        (book.world[cat] || []).forEach(function (e) {
          if (!found && e.id === id) found = e;
        });
      });
      return found;
    },
    getWorldSuggestion: function (book, id) {
      return (book.worldSug || []).filter(function (s) { return s.id === id; })[0] || null;
    },
    /* 转正：写进对应分栏（同名条目追加合并），并从待办里移除。
     * scope 为分卷 id 时写入该分卷专属设定。 */
    acceptWorldSuggestion: function (book, id, data, scope) {
      var s = this.getWorldSuggestion(book, id);
      if (!s) return null;
      /* 修改型：写回原条目。传了 data.content 就用它，否则用建议里整理好的内容。 */
      if (s.kind === 'update') {
        var target = this.findWorldEntry(book, s.targetId);
        if (!target) { this.dismissWorldSuggestions(book, id); return null; }
        var nc = data && data.content != null ? String(data.content) : s.content;
        if (nc.trim()) {
          target.content = nc;
          if (data && data.name != null) target.name = String(data.name);
          target.enabled = true; target.updatedAt = now();
        }
        book.worldSug = book.worldSug.filter(function (x) { return x.id !== id; });
        this.touchBook(book); this.save();
        return true;
      }
      var cat = (data && data.cat && WORLD_CATS.indexOf(data.cat) >= 0) ? data.cat : s.cat;
      var name = data && data.name != null ? String(data.name) : s.name;
      var content = data && data.content != null ? String(data.content) : s.content;
      var exist = (book.world[cat] || []).filter(function (e) {
        return name && e.name && e.name.trim() === name.trim() &&
          (!scope ? !e.scope : e.scope === scope);
      })[0];
      if (exist) {
        exist.content = exist.content ? exist.content + '\n' + content : content;
        exist.enabled = true; exist.updatedAt = now();
      } else {
        this.addWorldEntry(book, cat, name, content, scope);
      }
      book.worldSug = book.worldSug.filter(function (x) { return x.id !== id; });
      this.touchBook(book); this.save();
      return true;
    },
    /* 忽略：直接从待办里移除 */
    dismissWorldSuggestions: function (book, ids) {
      var list = Array.isArray(ids) ? ids : [ids];
      book.worldSug = (book.worldSug || []).filter(function (s) { return list.indexOf(s.id) < 0; });
      this.touchBook(book); this.save();
    },
    clearWorldSuggestions: function (book) {
      book.worldSug = [];
      this.touchBook(book); this.save();
    },

    /* =========================================================
     * AI 小编：对话 + 结构化改动提案
     * 小编**不直接写库**：它把改动写成提案，由界面确认后才落地。
     * 落地时记一条事务（before 快照），所以随时能整批退回。
     * ========================================================= */

    /* 小编能做的操作。risk 只影响界面上的提示语气，真正的闸门是「必须人工勾选」。 */
    EDITOR_OPS: {
      'world.add': { label: '新增设定', risk: 'low' },
      'world.update': { label: '修改设定', risk: 'low' },
      'world.del': { label: '删除设定', risk: 'high' },
      'hook.add': { label: '新增伏笔', risk: 'low' },
      'hook.update': { label: '修改伏笔', risk: 'low' },
      'chapter.outline': { label: '修改章节大纲', risk: 'low' },
      'volume.update': { label: '修改分卷大纲', risk: 'low' }
    },

    /* 按名称在全书设定里找条目：返回候选（>1 说明名字有歧义，要人来选） */
    findWorldByName: function (book, name) {
      var want = String(name || '').trim();
      if (!want) return [];
      var out = [];
      WORLD_CATS.forEach(function (cat) {
        ((book.world && book.world[cat]) || []).forEach(function (e) {
          if (String(e.name || '').trim() === want) out.push({ cat: cat, entry: e });
        });
      });
      return out;
    },

    /* 把模型给的原始 action 解析成「可预览、可执行」的提案。
     * 不做任何写入——这一步只负责说清楚「要改什么」，以及**能不能确定改哪儿**。
     * 定位不到或名字有歧义的标 unlocated，界面让用户自己处理，绝不猜着改。 */
    resolveEditorAction: function (book, act) {
      var op = String((act && act.op) || '').trim();
      var def = this.EDITOR_OPS[op];
      var out = {
        op: op, label: def ? def.label : op, risk: def ? def.risk : 'low',
        raw: act, ok: false, kind: 'update', idx: act && act.__idx,
        title: '', before: '', after: '', reason: '', target: null,
        /* 界面上「修改这条」要编辑什么：text = 直接编辑 content；
         * kv = 逐行写「键=值」（有多个字段可改时用）。 */
        editKind: '', editValue: '', editHint: ''
      };
      if (!def) { out.reason = '不认识的指令：' + (op || '(空)'); return out; }

      if (op === 'world.add') {
        var name = String(act.name || '').trim();
        var content = String(act.content || '').trim();
        var cat = String(act.cat || '').trim();
        if (WORLD_CATS.indexOf(cat) < 0) cat = 'concepts';
        if (!name && !content) { out.reason = '内容为空'; return out; }
        var dup = this.findWorldByName(book, name);
        out.kind = 'create';
        out.title = (WORLD_LABELS[cat] || cat) + ' · ' + (name || '(未命名)');
        out.before = '（新增）';
        out.after = content;
        out.target = { coll: 'book.world.' + cat, cat: cat, name: name, content: content };
        out.ok = true;
        out.editKind = 'text';
        out.editValue = content;
        out.editHint = '编辑这一条要写进世界书的内容';
        if (dup.length) out.warn = '已有同名条目，应用后会变成两条';
        return out;
      }

      if (op === 'world.update' || op === 'world.del') {
        var hits = this.findWorldByName(book, act.name);
        out.kind = op === 'world.del' ? 'remove' : 'update';
        out.title = '设定 · ' + (String(act.name || '').trim() || '(未填名称)');
        if (!hits.length) { out.reason = '世界书里找不到叫「' + act.name + '」的条目'; return out; }
        if (hits.length > 1) {
          out.reason = '有 ' + hits.length + ' 条同名（' + hits.map(function (h) { return WORLD_LABELS[h.cat]; }).join('、') + '），无法确定改哪条';
          return out;
        }
        var e = hits[0].entry;
        out.before = e.content || '';
        out.after = op === 'world.del' ? '（删除）' : String(act.content || '').trim();
        out.target = { coll: 'book.world.' + hits[0].cat, cat: hits[0].cat, id: e.id, name: e.name, content: out.after };
        if (op === 'world.update' && !out.after) { out.reason = '新内容为空'; return out; }
        out.ok = true;
        if (op === 'world.update') {
          out.editKind = 'text';
          out.editValue = out.after;
          out.editHint = '编辑这条设定改后的完整内容';
        }
        return out;
      }

      if (op === 'hook.add' || op === 'hook.update') {
        var hc = String(act.content || '').trim();
        out.title = '伏笔 · ' + (hc || '(未命名)');
        if (op === 'hook.add') {
          if (!hc) { out.reason = '内容为空'; return out; }
          out.kind = 'create';
          out.before = '（新增）';
          out.after = hc;
          out.target = {
            coll: 'book.hooks', content: hc,
            fromChapter: act.fromChapter, planChapter: act.planChapter, note: act.note
          };
          if (act.fromChapter || act.planChapter) {
            out.after += '（' + (act.fromChapter ? '第' + act.fromChapter + '章埋' : '') +
              (act.fromChapter && act.planChapter ? '，' : '') +
              (act.planChapter ? '计划第' + act.planChapter + '章回收' : '') + '）';
          }
          out.ok = true;
          out.editKind = 'text';
          out.editValue = hc;
          out.editHint = '编辑这条伏笔的内容';
          return out;
        }
        var hs = (book.hooks || []).filter(function (h) { return String(h.content || '').trim() === hc; });
        if (!hs.length) { out.reason = '伏笔板里找不到这条'; return out; }
        if (hs.length > 1) { out.reason = '有 ' + hs.length + ' 条一样的伏笔'; return out; }
        var h0 = hs[0];
        out.before = '状态 ' + h0.status + (h0.planChapter ? '，计划第' + h0.planChapter + '章回收' : '');
        var bits = [];
        if (act.status) bits.push('状态改为 ' + String(act.status));
        if (act.planChapter) bits.push('计划回收改为第' + act.planChapter + '章');
        if (act.note != null) bits.push('备注：' + String(act.note));
        out.after = bits.length ? bits.join('；') : '（没有给出要改什么）';
        if (!bits.length) { out.reason = '没有给出要改什么'; return out; }
        out.kind = 'update';
        out.target = { coll: 'book.hooks', id: h0.id, status: act.status, planChapter: act.planChapter, note: act.note };
        out.ok = true;
        out.editKind = 'kv';
        out.editValue = '回收=' + (act.planChapter || h0.planChapter || '') + '\n' +
          '状态=' + (act.status || h0.status || 'open') + '\n' +
          '备注=' + (act.note != null ? act.note : (h0.note || ''));
        out.editHint = '每行写一项：回收=章号 / 状态=open|resolved|dropped / 备注=…';
        return out;
      }

      if (op === 'chapter.outline') {
        var n = parseInt(act.chapter, 10);
        out.title = '章节 · 第' + (n || '?') + '章';
        if (!n || n < 1 || n > book.chapters.length) {
          out.reason = '章号超出范围（本书共 ' + book.chapters.length + ' 章）';
          return out;
        }
        var ch = book.chapters[n - 1];
        out.before = (ch.title ? '标题：' + ch.title + '\n' : '') + '大纲：' + (ch.outline || '（空）');
        var nTitle = act.title != null ? String(act.title).trim() : null;
        var nOutline = act.outline != null ? String(act.outline).trim() : null;
        if (!nTitle && !nOutline) { out.reason = '标题与大纲都没给'; return out; }
        out.after = (nTitle ? '标题：' + nTitle + '\n' : '') + (nOutline ? '大纲：' + nOutline : '');
        out.target = { coll: 'book.chapters', id: ch.id, title: nTitle, outline: nOutline };
        out.ok = true;
        out.editKind = 'kv';
        out.editValue = '标题=' + (nTitle || ch.title || '') + '\n大纲=' + (nOutline || ch.outline || '');
        out.editHint = '每行写一项：标题=… / 大纲=…';
        return out;
      }

      if (op === 'volume.update') {
        var vn = parseInt(act.volume, 10);
        out.title = '分卷 · 第' + (vn || '?') + '卷';
        if (!vn || vn < 1 || vn > book.volumes.length) {
          out.reason = '卷号超出范围（本书共 ' + book.volumes.length + ' 卷）';
          return out;
        }
        var vol = book.volumes[vn - 1];
        out.before = (vol.title ? '标题：' + vol.title + '\n' : '') + '大纲：' + (vol.summary || '（空）');
        var vTitle = act.title != null ? String(act.title).trim() : null;
        var vSum = act.summary != null ? String(act.summary).trim() : null;
        if (!vTitle && !vSum) { out.reason = '标题与大纲都没给'; return out; }
        out.after = (vTitle ? '标题：' + vTitle + '\n' : '') + (vSum ? '大纲：' + vSum : '');
        out.target = { coll: 'book.volumes', id: vol.id, title: vTitle, summary: vSum };
        out.ok = true;
        out.editKind = 'kv';
        out.editValue = '标题=' + (vTitle || vol.title || '') + '\n大纲=' + (vSum || vol.summary || '');
        out.editHint = '每行写一项：标题=… / 大纲=…';
        return out;
      }

      out.reason = '暂不支持的指令：' + op;
      return out;
    },

    /* 批量解析（界面用）。带上 __idx，界面靠它把每条提案的按钮对回原始 action。 */
    resolveEditorActions: function (book, acts) {
      var self = this;
      return (acts || []).map(function (a, i) {
        if (a) a.__idx = i;    // 忽略过某几条之后索引会变，每次都以当前顺序为准
        return self.resolveEditorAction(book, a);
      });
    },

    /* 作者在界面上改了一条建议后，把编辑内容写回 action 对象。
     * text 类：整段替换 content；kv 类：逐行「键=值」回写到对应字段。 */
    applyEditorEdit: function (act, text) {
      if (!act) return false;
      var t = String(text == null ? '' : text).trim();
      if (!t) return false;
      if (act.op !== 'hook.update' && act.op !== 'chapter.outline' && act.op !== 'volume.update') {
        act.content = t;
        return true;
      }
      var kv = {}, loose = [];
      t.split('\n').forEach(function (ln) {
        var i = ln.indexOf('=');
        if (i > 0) kv[ln.slice(0, i).trim()] = ln.slice(i + 1).trim();
        else if (ln.trim()) loose.push(ln.trim());
      });
      var hasKv = Object.keys(kv).length > 0;
      if (!hasKv) { kv = { '大纲': t.replace(/\s+/g, ' ').trim() }; }
      function get() {
        for (var i = 0; i < arguments.length; i++) if (kv[arguments[i]] != null) return kv[arguments[i]];
        return null;
      }
      if (act.op === 'hook.update') {
        var st = get('状态', 'status'); if (st) act.status = st;
        var pl = get('回收', '回收章', 'plan'); if (pl) act.planChapter = pl;
        var nt = get('备注', 'note'); if (nt != null) act.note = nt;
        return true;
      }
      var ti = get('标题', 'title'); if (ti) act.title = ti;
      var bo = get('大纲', '简介', 'outline', 'summary');
      if (bo == null && loose.length) bo = loose.join(' ');
      if (bo != null) {
        if (act.op === 'chapter.outline') act.outline = bo;
        else act.summary = bo;
      }
      return true;
    },

    /* 落地一批提案，并记一条可撤销的事务。
     * 只应用 ok 的；每条都存 before 快照——这是「随时能退回去」的唯一依据。 */
    applyEditorActions: function (book, props, label) {
      if (!Array.isArray(book.txns)) book.txns = [];
      var changes = [];
      var self = this;
      var n = 0;
      props.forEach(function (p) {
        if (!p || !p.ok || !p.target) return;
        var t = p.target, coll = t.coll;
        var arr = self._collArr(book, coll);
        if (!arr) return;
        if (p.kind === 'create') {
          var item;
          if (coll === 'book.hooks') {
            item = self.addHook(book, {
              content: t.content, fromChapter: t.fromChapter,
              planChapter: t.planChapter, note: t.note
            });
            if (!item) return;
          } else {
            item = self.addWorldEntry(book, t.cat, t.name, t.content);
          }
          changes.push({ coll: coll, id: item.id, index: arr.length - 1, before: null, after: JSON.parse(JSON.stringify(item)) });
          n++;
          return;
        }
        var i = arr.findIndex(function (x) { return x.id === t.id; });
        if (i < 0) return;
        var before = JSON.parse(JSON.stringify(arr[i]));
        var after = JSON.parse(JSON.stringify(arr[i]));
        if (p.kind === 'remove') {
          arr.splice(i, 1);
          changes.push({ coll: coll, id: t.id, index: i, before: before, after: null });
          n++;
          return;
        }
        if (t.content != null && t.content !== '') {
          after.content = t.content;
          // 设定条目改名时同步改 name
          if (coll.indexOf('book.world.') === 0 && t.name) after.name = t.name;
        }
        if (t.title != null && t.title !== '') after.title = t.title;
        if (t.outline != null && t.outline !== '') after.outline = t.outline;
        if (t.summary != null && t.summary !== '') after.summary = t.summary;
        if (t.status) after.status = t.status;
        if (t.planChapter) after.planChapter = parseInt(t.planChapter, 10);
        if (t.note != null) after.note = String(t.note);
        after.updatedAt = now();
        arr[i] = after;
        changes.push({ coll: coll, id: t.id, index: i, before: before, after: JSON.parse(JSON.stringify(after)) });
        n++;
      });
      if (!n) return null;
      var txn = { id: uid(), at: now(), label: label || '小编的改动', changes: changes };
      book.txns.push(txn);
      if (book.txns.length > 20) book.txns = book.txns.slice(-20);
      this.touchBook(book); this.save();
      return txn;
    },

    _collArr: function (book, coll) {
      if (coll && coll.indexOf('book.world.') === 0) {
        var cat = coll.slice('book.world.'.length);
        if (!book.world || !Array.isArray(book.world[cat])) return null;
        return book.world[cat];
      }
      if (coll === 'book.hooks') return book.hooks || (book.hooks = []);
      if (coll === 'book.chapters') return book.chapters;
      if (coll === 'book.volumes') return book.volumes;
      return null;
    },

    /* 撤销一条事务：按 before 快照倒着还原。before 为 null = 这条是新增，删掉即可。 */
    undoTxn: function (book, txnId) {
      var i = (book.txns || []).findIndex(function (t) { return t.id === txnId; });
      if (i < 0) return false;
      var txn = book.txns[i];
      var self = this;
      for (var k = txn.changes.length - 1; k >= 0; k--) {
        var c = txn.changes[k];
        var arr = self._collArr(book, c.coll);
        if (!arr) continue;
        var at = arr.findIndex(function (x) { return x.id === c.id; });
        if (c.before === null) {
          if (at >= 0) arr.splice(at, 1);            // 新增的，撤掉
        } else if (at >= 0) {
          arr[at] = c.before;                        // 改过的，还原
        } else {
          var idx = Math.max(0, Math.min(c.index == null ? arr.length : c.index, arr.length));
          arr.splice(idx, 0, c.before);              // 删掉的，插回原位置
        }
      }
      book.txns.splice(i, 1);
      this.touchBook(book); this.save();
      return true;
    },

    /* ---------- 小编对话记录 ---------- */
    addChat: function (book, msg) {
      if (!Array.isArray(book.chat)) book.chat = [];
      var m = {
        id: uid(), role: msg.role === 'user' ? 'user' : 'ai',
        text: String(msg.text == null ? '' : msg.text),
        actions: Array.isArray(msg.actions) ? msg.actions : [],
        ctx: msg.ctx || '',
        createdAt: now()
      };
      book.chat.push(m);
      // 聊天记录跟着书存本地，长篇下别让它无限涨
      if (book.chat.length > 60) book.chat = book.chat.slice(-60);
      this.touchBook(book); this.save();
      return m;
    },
    clearChat: function (book) {
      book.chat = [];
      this.touchBook(book); this.save();
    },
    updateChatActions: function (book, msgId, actions) {
      var m = (book.chat || []).filter(function (x) { return x.id === msgId; })[0];
      if (!m) return null;
      m.actions = actions;
      this.touchBook(book); this.save();
      return m;
    },

    /* ---------- 分卷 ---------- */
    addVolume: function (book, title, summary) {
      var v = { id: uid(), title: title || '', summary: summary || '' };
      book.volumes.push(v);
      this.touchBook(book); this.save();
      return v;
    },
    getVolume: function (book, id) {
      return book.volumes.filter(function (v) { return v.id === id; })[0] || null;
    },
    /* 删除分卷。
     * 设计上「每章必属于某个分卷」，所以这里**绝不把章节的 volumeId 置空**——
     * 那正是孤儿章节的唯一来源。若该卷下还有章节且还有别的卷，
     * 统一把它们并入剩余的第一个分卷；调用方（app.js）已在删除前询问过用户。
     */
    removeVolume: function (book, id) {
      book.volumes = book.volumes.filter(function (v) { return v.id !== id; });
      var fallback = book.volumes.length ? book.volumes[0].id : '';
      book.chapters.forEach(function (c) { if (c.volumeId === id) c.volumeId = fallback; });
      this.touchBook(book); this.save();
    },
    /* 该卷在 book.volumes 里的真实序号（0 基），找不到返回 -1 */
    volumeIndex: function (book, id) {
      return book.volumes.findIndex(function (v) { return v.id === id; });
    },

    /* ---------- 章节 ---------- */
    addChapter: function (book, data) {
      var c = {
        id: uid(),
        title: (data && data.title) || '',
        outline: (data && data.outline) || '',
        content: (data && data.content) || '',
        volumeId: (data && data.volumeId) || '',
        marks: [],                    // 划线标记：{id, start, end, anchor, note}
        createdAt: now(),
        updatedAt: now()
      };
      book.chapters.push(c);
      this.touchBook(book); this.save();
      return c;
    },
    getChapter: function (book, id) {
      return book.chapters.filter(function (c) { return c.id === id; })[0] || null;
    },
    chapterIndex: function (book, id) {
      return book.chapters.findIndex(function (c) { return c.id === id; });
    },
    removeChapter: function (book, id) {
      var i = this.chapterIndex(book, id);
      if (i < 0) return;
      book.chapters.splice(i, 1);
      book.memory.entries = book.memory.entries.filter(function (m) { return m.chapterId !== id; });
      book.undoStack = book.undoStack.filter(function (u) { return u.chapterId !== id; });
      if (book.lastChapterId === id) { book.lastChapterId = ''; book.lastReadAt = 0; }
      this.touchBook(book); this.save();
    },
    /* 记录“最近阅读 / 编辑的章节”（只更新指针，不动 updatedAt） */
    touchChapter: function (book, chapter) {
      if (!book || !chapter) return;
      if (book.lastChapterId === chapter.id) { book.lastReadAt = now(); return; }
      book.lastChapterId = chapter.id;
      book.lastReadAt = now();
      this.saveSoon();
    },
    /* 取这本书最近阅读的章节；没有记录时回落到第一章 */
    lastChapter: function (book) {
      if (!book || !book.chapters.length) return null;
      if (book.lastChapterId) {
        var c = this.getChapter(book, book.lastChapterId);
        if (c) return c;
      }
      return book.chapters[0];
    },
    moveChapter: function (book, id, dir) {
      var i = this.chapterIndex(book, id), j = i + dir;
      if (i < 0 || j < 0 || j >= book.chapters.length) return false;
      var tmp = book.chapters[i]; book.chapters[i] = book.chapters[j]; book.chapters[j] = tmp;
      this.touchBook(book); this.save();
      return true;
    },
    /* 换分卷：把章节挪到目标分卷的**末尾**。
     * 注意目标卷下还没有章节时，原来的实现会 splice(0,0,c) 把它插到全书最前面，
     * 与「挪到该卷末尾」的语义相反。这里改为：找到该卷在 volumes 里的位置，
     * 插到「该卷之前所有卷的章节之后」，即该卷应有的起始位置。
     */
    moveChapterToVolume: function (book, chapterId, volumeId) {
      var i = this.chapterIndex(book, chapterId);
      if (i < 0) return false;
      if (!volumeId || !this.getVolume(book, volumeId)) return false;
      var c = book.chapters[i];
      if (c.volumeId === volumeId) return false;   // 已在该卷，无需移动

      book.chapters.splice(i, 1);

      var last = -1;
      for (var k = 0; k < book.chapters.length; k++) {
        if (book.chapters[k].volumeId === volumeId) last = k;
      }
      if (last < 0) {
        // 该卷还没有章节：插到它前面那些卷的最后一条之后
        var vi = this.volumeIndex(book, volumeId);
        var before = {};
        for (var v = 0; v < vi; v++) before[book.volumes[v].id] = 1;
        for (var m = book.chapters.length - 1; m >= 0; m--) {
          if (before[book.chapters[m].volumeId]) { last = m; break; }
        }
      }

      c.volumeId = volumeId;
      c.updatedAt = now();
      book.chapters.splice(last + 1, 0, c);
      this.touchBook(book); this.save();
      return true;
    },

    /* ---------- 正文框选标记（局部改稿） ----------
     * 标记的来源是正文里的【【】】，不是浏览器选区。chapter.marks 退化成
     * **意见簿**：只存 {anchor, note}，按框里的原文对齐。位置每次现算，
     * 所以作者随手改正文（加字、删段、换顺序）都不会让意见错位到别处。
     */

    /* 当前正文里的框 + 对齐好的意见。界面与执行都只看这个结果。 */
    bracketItems: function (chapter) {
      var items = Util.parseBracketMarks((chapter && chapter.content) || '');
      var pool = ((chapter && chapter.marks) || []).slice();
      var used = {};
      items.forEach(function (it) {
        var hit = pool.filter(function (m) {
          return !used[m.id] && String(m.anchor || '') === it.anchor;
        })[0];
        if (hit) { used[hit.id] = 1; it.note = hit.note || ''; it.noteId = hit.id; }
        else { it.note = ''; it.noteId = ''; }
      });
      return items;
    },

    /* 写某一条的意见。同一段文字被框了多次时，按出现顺序对齐（第 1 个框配第 1 条意见）。 */
    setBracketNote: function (book, chapter, idx, note) {
      var items = this.bracketItems(chapter);
      var it = items[idx];
      if (!it) return null;
      if (!Array.isArray(chapter.marks)) chapter.marks = [];
      var rank = items.filter(function (x) { return x.anchor === it.anchor; }).indexOf(it);
      var cands = chapter.marks.filter(function (m) { return String(m.anchor || '') === it.anchor; });
      var target = cands[rank];
      if (!target) {
        target = { id: uid(), anchor: it.anchor, note: '', createdAt: now() };
        chapter.marks.push(target);
      }
      target.note = String(note == null ? '' : note);
      target.updatedAt = now();
      this.touchBook(book); this.save();
      return target;
    },

    /* 清掉「已经被作者从正文里删掉的框」留下的孤儿意见 */
    pruneBracketNotes: function (book, chapter) {
      if (!chapter || !Array.isArray(chapter.marks) || !chapter.marks.length) return false;
      var quota = {};
      Util.parseBracketMarks(chapter.content || '').forEach(function (it) {
        quota[it.anchor] = (quota[it.anchor] || 0) + 1;
      });
      var seen = {}, keep = [];
      chapter.marks.forEach(function (m) {
        var a = String(m.anchor || '');
        seen[a] = (seen[a] || 0) + 1;
        if (quota[a] >= seen[a]) keep.push(m);
      });
      if (keep.length === chapter.marks.length) return false;
      chapter.marks = keep;
      this.touchBook(book); this.save();
      return true;
    },

    /* 取消全部标记：把正文里的【【】】去掉（框里的字保留），意见一并清空 */
    clearBracketMarks: function (book, chapter) {
      if (!chapter) return;
      chapter.content = Util.stripBrackets(chapter.content || '');
      chapter.marks = [];
      chapter.updatedAt = now();
      this.touchBook(book); this.save();
    },

    /* ---------- 旧的选区标记（按偏移定位，通用） ----------
     * 每条记下位置偏移 + 原文快照。原文快照是关键：正文被重新生成 / 手动改过之后，
     * 偏移会失效，靠它重新定位（且只在全文中唯一出现时才认，避免改错地方）。
     */
    addMark: function (book, chapter, start, end, note) {
      if (!chapter) return null;
      var s = String(chapter.content || '');
      start = Math.max(0, Math.min(start | 0, s.length));
      end = Math.max(0, Math.min(end | 0, s.length));
      if (end <= start) return null;
      var anchor = s.slice(start, end);
      if (!anchor.trim()) return null;              // 纯空白不值得标
      if (!Array.isArray(chapter.marks)) chapter.marks = [];
      // 与已有标记重叠的直接并入（同一处划两次没意义）
      var hit = chapter.marks.filter(function (m) {
        var p = Util.locateMark(s, m);
        return p && !(p.end <= start || p.start >= end);
      })[0];
      if (hit) {
        var hp = Util.locateMark(s, hit);
        hit.start = Math.min(hp.start, start);
        hit.end = Math.max(hp.end, end);
        hit.anchor = s.slice(hit.start, hit.end);
        if (note) hit.note = note;
        hit.updatedAt = now();
        this.touchBook(book); this.save();
        return hit;
      }
      var mk = {
        id: uid(), start: start, end: end, anchor: anchor,
        note: String(note == null ? '' : note),
        createdAt: now()
      };
      chapter.marks.push(mk);
      this.touchBook(book); this.save();
      return mk;
    },
    getMark: function (chapter, id) {
      return ((chapter && chapter.marks) || []).filter(function (m) { return m.id === id; })[0] || null;
    },
    updateMark: function (book, chapter, id, note) {
      var m = this.getMark(chapter, id);
      if (!m) return null;
      m.note = String(note == null ? '' : note);
      m.updatedAt = now();
      this.touchBook(book); this.save();
      return m;
    },
    removeMark: function (book, chapter, id) {
      if (!chapter || !Array.isArray(chapter.marks)) return false;
      var n = chapter.marks.length;
      chapter.marks = chapter.marks.filter(function (m) { return m.id !== id; });
      if (chapter.marks.length === n) return false;
      this.touchBook(book); this.save();
      return true;
    },
    clearMarks: function (book, chapter) {
      if (!chapter) return;
      chapter.marks = [];
      this.touchBook(book); this.save();
    },
    /* 能定位到当前正文的标记（定位不到的是「正文已变，这处标记失效了」） */
    liveMarks: function (chapter) {
      var s = String((chapter && chapter.content) || '');
      return ((chapter && chapter.marks) || []).map(function (m) {
        var p = Util.locateMark(s, m);
        return p ? { mark: m, start: p.start, end: p.end } : { mark: m, start: -1, end: -1 };
      });
    },

    /* ---------- 记忆 ---------- */
    /* 写入章节记忆：**同一章只保留一条**（就地更新，id 不变）。
     * 原来是每次生成都 push 一条新的，于是「重新生成」几次这章就有几份记忆——
     * 它们描述的还是同一章的不同版本，注入时互相矛盾，撤回也没法定位。
     * summaryBefore（写这一章之前的摘要快照）保留最早那次的值。 */
    addMemory: function (book, chapter, text, prevSummary) {
      if (!book.memory) book.memory = { enabled: true, summary: '', entries: [], keepRecent: 6 };
      if (!Array.isArray(book.memory.entries)) book.memory.entries = [];
      var cid = chapter ? chapter.id : '';
      var idx = chapter ? this.chapterIndex(book, chapter.id) : -1;
      var exist = cid ? book.memory.entries.filter(function (e) { return e.chapterId === cid; })[0] : null;
      if (exist) {
        exist.text = text;
        exist.chapterIndex = idx;
        exist.chapterTitle = chapter ? chapter.title : '';
        if (!exist.summaryBefore && prevSummary) exist.summaryBefore = prevSummary;
        exist.updatedAt = now();
        this.touchBook(book); this.save();
        return exist;
      }
      var e = {
        id: uid(),
        chapterId: cid,
        chapterIndex: idx,
        chapterTitle: chapter ? chapter.title : '',
        text: text,
        summaryBefore: prevSummary || '',
        createdAt: now()
      };
      book.memory.entries.push(e);
      this.touchBook(book); this.save();
      return e;
    },
    /* 本章现有的记忆条目（正规定义：一章至多一条） */
    getMemoryEntry: function (book, chapter) {
      var cid = chapter ? chapter.id : '';
      if (!cid) return null;
      return ((book.memory && book.memory.entries) || []).filter(function (e) { return e.chapterId === cid; })[0] || null;
    },
    /* 本章在长期记忆里的「前情基线」：写这一章之前那一刻的摘要。
     * 本章已有记忆条目时用它的 summaryBefore 快照回溯——
     * 直接用当前摘要会把本章上一版的剧情当成前情喂回去，重写就越改越像自己抄自己。 */
    memoryBaseline: function (book, chapter) {
      var i = chapter ? this.chapterIndex(book, chapter.id) : -1;
      var list = (book.memory && book.memory.entries) || [];
      if (i >= 0) {
        for (var k = list.length - 1; k >= 0; k--) {
          var e = list[k];
          var p = e.chapterId ? this.chapterIndex(book, e.chapterId) : -1;
          if (p < 0) p = typeof e.chapterIndex === 'number' ? e.chapterIndex : -1;
          if (p === i && e.summaryBefore) return e.summaryBefore;
        }
      }
      return (book.memory && book.memory.summary) || '';
    },
    removeMemory: function (book, entryId) {
      book.memory.entries = book.memory.entries.filter(function (e) { return e.id !== entryId; });
      this.touchBook(book); this.save();
    },

    /* ---------- 撤回栈 ----------
     * snapshot 必须在「生成之前」取，否则撤回等于没撤。
     */
    pushUndo: function (book, chapter, memoryEntryId, prevSummary, snapshot, worldSugIds, memoryBefore, kind) {
      var u = {
        id: uid(),
        chapterId: chapter.id,
        // 'write'（整章生成）/ 'patch'（只改标记处）：撤回提示语据此区分
        kind: kind || 'write',
        snapshot: snapshot || { title: chapter.title, outline: chapter.outline, content: chapter.content },
        memoryEntryId: memoryEntryId || '',
        summaryBefore: prevSummary || '',
        worldSugIds: worldSugIds || [],
        /* 重写场景：本章生成前就有的那条记忆。撤回时要**恢复它**而不是删掉，
         * 否则一次重写撤回后，这章的记忆就凭空消失了。 */
        memoryBefore: memoryBefore ? {
          id: memoryBefore.id,
          text: memoryBefore.text,
          chapterIndex: memoryBefore.chapterIndex,
          chapterTitle: memoryBefore.chapterTitle,
          summaryBefore: memoryBefore.summaryBefore
        } : null,
        createdAt: now()
      };
      book.undoStack.push(u);
      /* 撤回快照里存着整章旧正文，长篇下 30 条会吃掉可观的空间；保留最近 10 条足够日常反悔 */
      if (book.undoStack.length > 10) book.undoStack.shift();
      this.touchBook(book); this.save();
      return u;
    },
    /* 弹出指定的一条（生成彻底失败时用来清理刚压进去的空快照） */
    dropUndo: function (book, id) {
      var before = book.undoStack.length;
      book.undoStack = book.undoStack.filter(function (u) { return u.id !== id; });
      if (book.undoStack.length !== before) this.save();
    },
    popUndo: function (book) {
      var u = book.undoStack.pop();
      return u || null;
    },

    /* ---------- 导入导出 ---------- */
    exportBook: function (id) {
      var b = this.getBook(id);
      return b ? JSON.stringify(b, null, 2) : '';
    },
    importBook: function (json) {
      var b;
      try { b = JSON.parse(json); } catch (e) { throw new Error('不是合法的 JSON 文件'); }
      // 校验必要结构，避免把任意 JSON 塞进书架后变成删不掉的坏数据
      if (!b || typeof b !== 'object' || Array.isArray(b)) throw new Error('文件格式不正确：期望一个书本对象');
      if (typeof b.title !== 'string' || !b.title.trim()) throw new Error('文件格式不正确：缺少书名');
      if (b.chapters != null && !Array.isArray(b.chapters)) throw new Error('文件格式不正确：chapters 必须是数组');
      if (b.volumes != null && !Array.isArray(b.volumes)) throw new Error('文件格式不正确：volumes 必须是数组');

      b.id = uid();
      b.createdAt = now(); b.updatedAt = now();
      this.state.books.unshift(b);
      this.migrate();
      this.save();
      return b;
    },
    exportAll: function () { return JSON.stringify(this.state, null, 2); },
    importAll: function (json) {
      var s;
      try { s = JSON.parse(json); } catch (e) { throw new Error('不是合法的 JSON 文件'); }
      if (!looksLikeState(s)) throw new Error('文件格式不正确：缺少 books 数组');
      if (!Array.isArray(s.providers)) s.providers = [];
      if (!Array.isArray(s.globalPrompts)) s.globalPrompts = [];
      this.state = s;
      this.migrate();
      this.save();
    },
    resetAll: function () {
      this.state = defaultState();
      this.save();
    }
  };

  global.Store = Store;
})(window);

</script>
<script>
/* =========================================================
 * API —— 多提供商适配层
 * 支持：openai(兼容 OpenAI 的一切) / anthropic / google / custom
 * ========================================================= */
(function (global) {
  'use strict';

  var PRESETS = {
    openai: { name: 'OpenAI', baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
    deepseek: { name: 'DeepSeek', baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
    moonshot: { name: 'Moonshot / Kimi', baseUrl: 'https://api.moonshot.cn/v1', model: 'moonshot-v1-8k' },

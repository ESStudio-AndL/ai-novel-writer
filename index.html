<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI 小说写作助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header class="appbar" id="appbar"></header>
  <main class="page-root" id="page"></main>
</div>

<!-- 底部主导航 -->
<nav class="tabbar hidden" id="tabbar">
  <button class="tab-item" data-tab="books" data-act="nav" data-to="#/books">
    <span class="tab-icon">📚</span><span class="tab-label">书架</span>
  </button>
  <button class="tab-item" data-tab="recent" data-act="nav" data-to="#/recent">
    <span class="tab-icon">🕘</span><span class="tab-label">最近</span>
  </button>
  <button class="tab-item" data-tab="import" data-act="nav" data-to="#/import">
    <span class="tab-icon">📥</span><span class="tab-label">导入</span>
  </button>
  <button class="tab-item" data-tab="settings" data-act="nav" data-to="#/settings">
    <span class="tab-icon">⚙</span><span class="tab-label">设置</span>
  </button>
</nav>

<!-- 底部弹出面板 -->
<div class="sheet-root hidden" id="sheetRoot">
  <div class="sheet-mask" data-sheet-close></div>
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle"></div>
      <button class="icon-btn" data-sheet-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<!-- 全屏编辑器（大文本） -->
<div class="fullscreen-editor hidden" id="fullEditor">
  <div class="appbar">
    <button class="icon-btn" id="feBack">‹</button>
    <div class="appbar-title" id="feTitle">编辑</div>
    <button class="icon-btn primary-text" id="feSave">保存</button>
  </div>
  <textarea class="fe-textarea" id="feText" spellcheck="false"></textarea>
  <div class="fe-status" id="feStatus"></div>
</div>

<div class="toast-root" id="toastRoot"></div>

<!-- 可拖动悬浮球：撤销上次改动 / 查看上次 AI 上下文 / 切换模型预设 -->
<div id="fab" class="fab" title="撤销 / AI 上下文 / 模型预设">◆</div>
<div id="fabPanel" class="fab-panel hidden">
  <div class="fab-title">快捷工具</div>
  <button class="btn block" data-act="fab.undo">↩ 撤销上次生成</button>
  <button class="btn block" data-act="fab.ctx">📋 查看上次 AI 上下文</button>
  <button class="btn block" data-act="fab.presets">🔀 切换模型预设</button>
</div>

<div class="busy hidden" id="busy">
  <div class="busy-box">
    <div class="spinner"></div>
    <div class="busy-text" id="busyText">处理中…</div>
    <button class="btn ghost sm" id="busyCancel">中止</button>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
